name: evently_mobile
description: Flutter mobile client for the Event Ticket Platform Spring Boot API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  oidc: ^4.0.0
  oidc_default_store: ^1.1.2
  oidc_core: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
